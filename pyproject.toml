[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "property-value-insights"
version = "0.1.0.dev0"
description = "Reproducible residential price estimation system with machine learning and MLOps."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib==1.5.3",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pydantic>=2.9,<3",
    "scikit-learn==1.9.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<7",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "tabulate>=0.9,<1",
]

[project.scripts]
train-property-model = "property_value_insights.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
