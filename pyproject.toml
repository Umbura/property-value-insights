[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "property-value-insights"
version = "1.0.1"
description = "Reproducible residential price estimation system with machine learning and MLOps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "joblib==1.5.3",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "scikit-learn==1.9.0",
    "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
reporting = [
    "matplotlib>=3.9,<4",
]
explainability = [
    "llvmlite==0.48.0",
    "matplotlib>=3.9,<4",
    "numba==0.66.0",
    "shap==0.52.0",
]
dev = [
    "httpx2==2.9.1",
    "ipykernel>=6.29,<7",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "llvmlite==0.48.0",
    "numba==0.66.0",
    "pip-audit==2.10.1",
    "pytest==9.0.3",
    "ruff>=0.8,<1",
    "shap==0.52.0",
    "tabulate>=0.9,<1",
]

[project.scripts]
train-property-model = "property_value_insights.training:main"
analyze-property-uncertainty = "property_value_insights.uncertainty:main"
explain-property-model = "property_value_insights.explainability:main"
sanitize-property-notebooks = "property_value_insights.notebook_hygiene:main"
verify-property-release = "property_value_insights.release_readiness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
required-version = "==0.12.1"
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
