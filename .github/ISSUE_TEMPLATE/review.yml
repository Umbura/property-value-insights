name: Revisão ou investigação
description: Registrar uma investigação com evidências verificáveis.
title: ""
labels:
  - review
assignees: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: O que a investigação deve esclarecer?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo da investigação
      description: Componentes, comportamentos ou limites a analisar.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Método ou evidências esperadas
      description: Testes, inspeções, métricas ou referências a obter.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Como saber que a investigação está concluída?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Fora do escopo
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Referências
    validations:
      required: false
