name: Bug ou regressão
description: Registrar um comportamento incorreto, regressão ou falha reproduzível.
title: ""
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Natureza: **Bug**. Registre somente comportamentos observados. Não inclua segredos, dados pessoais, payloads sensíveis ou credenciais nas evidências.

  - type: checkboxes
    id: area
    attributes:
      label: Área afetada
      description: Selecione todas as áreas envolvidas.
      options:
        - label: API
        - label: Model
        - label: Data
        - label: Testing
        - label: Docker
        - label: CI
        - label: Documentation
        - label: Governance
        - label: Repository
        - label: Automation
    validations:
      required: true

  - type: dropdown
    id: cycle
    attributes:
      label: Ciclo esperado
      description: Bugs confirmados normalmente são corrigidos no Ciclo 2, salvo bloqueios de validação final.
      options:
        - Ciclo 1 — Revisão e diagnóstico
        - Ciclo 2 — Correções e estabilização
        - Ciclo 3 — Validação final e entrega
        - Manutenção fora dos ciclos técnicos
        - A definir
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Prioridade proposta
      options:
        - High — bloqueia entrega, confiabilidade, segurança ou reprodutibilidade
        - Medium — impacto relevante sem bloqueio imediato
        - Low — defeito não bloqueante ou de alcance limitado
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Resumo do problema
      description: Descreva o defeito de forma curta, objetiva e impessoal.
      placeholder: Qual comportamento está incorreto?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto e ambiente
      description: Informe versão, branch, commit, sistema, Python, Docker ou endpoint relevantes.
      placeholder: |
        - release ou commit:
        - ambiente:
        - comando, endpoint ou componente:
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Comportamento atual
      description: Explique exatamente o que ocorreu, incluindo status, mensagem ou resultado observado.
      placeholder: O que aconteceu?
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Comportamento esperado
      description: Explique o resultado correto conforme contrato, teste ou documentação existente.
      placeholder: O que deveria ter acontecido?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Forneça uma sequência mínima e reproduzível.
      placeholder: |
        1. executar ...
        2. enviar ...
        3. observar ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Inclua logs sanitizados, respostas, screenshots, testes falhos ou referências, sem expor informações sensíveis.
      placeholder: Cole apenas evidências necessárias e sanitizadas.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impacto observado
      description: Classifique o efeito prático do problema atual.
      options:
        - Baixo — inconveniente sem comprometer o fluxo principal
        - Médio — comportamento incorreto com alternativa disponível
        - Alto — fluxo principal comprometido ou resultado não confiável
        - Crítico — risco de segurança, corrupção, perda de dados ou serving inseguro
    validations:
      required: true

  - type: textarea
    id: suspected_scope
    attributes:
      label: Escopo provável da correção
      description: Registre componentes possivelmente envolvidos sem transformar hipótese em diagnóstico confirmado.
      placeholder: Quais arquivos, contratos ou testes provavelmente precisam ser avaliados?
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Defina como a correção e a ausência de regressão serão verificadas.
      placeholder: |
        - [ ] o caso reproduzido passa;
        - [ ] teste de regressão adicionado;
        - [ ] comportamento existente compatível preservado;
        - [ ] documentação alinhada quando aplicável.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validação esperada
      description: Indique comandos, cenários e inspeções necessários para confirmar a correção.
      placeholder: |
        - teste direcionado;
        - suíte completa;
        - Ruff;
        - validação manual do fluxo afetado.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Riscos e compatibilidade
      description: Registre riscos de regressão, contratos afetados e requisitos de rollback.
      placeholder: Quais comportamentos existentes precisam ser preservados?
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: Fora do escopo
      description: Liste refatorações, melhorias ou alterações de contrato que não fazem parte desta correção.
      placeholder: Nenhuma alteração adicional aprovada.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependências e referências
      placeholder: Review de origem, Issue relacionada, contrato, teste ou relatório.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmação
      options:
        - label: O problema foi observado ou reproduzido; hipóteses ainda não confirmadas foram identificadas como tais.
          required: true
        - label: As evidências foram revisadas e não contêm segredos, credenciais ou dados pessoais.
          required: true
