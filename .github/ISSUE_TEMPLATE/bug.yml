name: Bug ou regressão
description: Registrar um comportamento incorreto ou uma regressão reproduzível.
title: ""
labels:
  - bug
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Descreva o comportamento incorreto observado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      description: Forneça passos mínimos, evidências sanitizadas ou um teste falho.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Contexto ou ambiente
      description: Versão, commit, sistema ou componente relevante.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Fora do escopo
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: Referências
    validations:
      required: false
