name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Verify release readiness
        run: uv run --locked verify-property-release --project-root .

      - name: Audit Python dependencies
        run: uv run --locked pip-audit

  container:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --tag property-value-insights:ci .

      - name: Start API container
        run: |
          docker run --detach \
            --name property-value-insights \
            --publish 8000:8000 \
            --read-only \
            --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            property-value-insights:ci

      - name: Wait for healthy API
        shell: bash
        run: |
          for attempt in {1..20}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' property-value-insights)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs property-value-insights
              exit 1
            fi
            sleep 2
          done
          docker logs property-value-insights
          exit 1

      - name: Verify public endpoints
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/model-info
          curl --fail --silent http://127.0.0.1:8000/metrics
          curl --fail --silent \
            --request POST \
            --header 'Content-Type: application/json' \
            --data @- \
            http://127.0.0.1:8000/predict <<'JSON'
          {
            "bedrooms": 4,
            "bathrooms": 1.0,
            "sqft_living": 1680,
            "sqft_lot": 5043,
            "floors": 1.5,
            "waterfront": 0,
            "view": 0,
            "condition": 4,
            "grade": 6,
            "sqft_above": 1680,
            "sqft_basement": 0,
            "yr_built": 1911,
            "yr_renovated": 0,
            "zipcode": "98118",
            "lat": 47.5354,
            "long": -122.273,
            "sqft_living15": 1560,
            "sqft_lot15": 5765
          }
          JSON

      - name: Stop API container
        if: always()
        run: docker rm --force property-value-insights || true
