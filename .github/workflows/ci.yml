name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --tag property-value-insights:ci .

      - name: Start API container
        run: docker run --detach --name property-value-insights --publish 8000:8000 property-value-insights:ci

      - name: Wait for healthy API
        shell: bash
        run: |
          for attempt in {1..20}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' property-value-insights)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs property-value-insights
              exit 1
            fi
            sleep 2
          done
          docker logs property-value-insights
          exit 1

      - name: Verify public endpoints
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/model-info
          curl --fail --silent http://127.0.0.1:8000/metrics

      - name: Stop API container
        if: always()
        run: docker rm --force property-value-insights || true
