name: Deploy stakeholder site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "reports/figures/approved_model_diagnostic.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        env:
          PVI_API_BASE_URL: ${{ vars.PVI_API_BASE_URL }}
        run: |
          rm -rf _site
          cp -R site _site
          mkdir -p _site/assets
          cp reports/figures/approved_model_diagnostic.png _site/assets/approved_model_diagnostic.png
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base_url = os.environ.get("PVI_API_BASE_URL", "").strip().rstrip("/")
          Path("_site/config.js").write_text(
              "window.PVI_CONFIG = { apiBaseUrl: "
              + json.dumps(api_base_url)
              + " };\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
